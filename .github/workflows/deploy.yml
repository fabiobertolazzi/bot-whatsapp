name: Deploy Lambda DEV

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências de produção
        run: |
          rm -rf package
          mkdir package

          python -m pip install --upgrade pip

          pip install -r requirements.txt -t package

      - name: Copiar código
        run: |
          cp -R src package/

      - name: Gerar ZIP
        run: |
          cd package
          zip -rq ../function.zip .

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::065560086735:role/GitHubActionsLambdaDeployRole
          aws-region: sa-east-1

      - name: Atualizar código da Lambda
        run: |
          aws lambda update-function-code \
            --function-name bot-whatsapp \
            --zip-file fileb://function.zip \
            --region sa-east-1

      - name: Aguardar atualização da Lambda
        run: |
          aws lambda wait function-updated \
          --function-name bot-whatsapp \
          --region sa-east-1

      - name: Publicar nova versão
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name bot-whatsapp \
            --description "Deploy DEV - $GITHUB_SHA" \
            --query 'Version' \
            --output text \
            --region sa-east-1)

          echo "Nova versão publicada: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Atualizar alias DEV
        run: |
          aws lambda update-alias \
            --function-name bot-whatsapp \
            --name dev \
            --function-version ${{ steps.publish.outputs.version }} \
            --region sa-east-1