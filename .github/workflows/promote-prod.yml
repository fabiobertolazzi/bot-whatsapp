name: Promote DEV to PROD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::065560086735:role/GitHubActionsLambdaDeployRole
          aws-region: sa-east-1

      - name: Obter versão do DEV
        id: dev
        run: |
          VERSION=$(aws lambda get-alias \
            --function-name bot-whatsapp \
            --name dev \
            --query 'FunctionVersion' \
            --output text \
            --region sa-east-1)

          echo "================================="
          echo "Versão atualmente em DEV: $VERSION"
          echo "================================="

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Mostrar versão atual de PROD
        run: |
          PROD_VERSION=$(aws lambda get-alias \
            --function-name bot-whatsapp \
            --name prod \
            --query 'FunctionVersion' \
            --output text \
            --region sa-east-1)

          echo "Versão atual de PROD: $PROD_VERSION"
          echo "Nova versão de PROD: ${{ steps.dev.outputs.version }}"

      - name: Promover DEV para PROD
        run: |
          aws lambda update-alias \
            --function-name bot-whatsapp \
            --name prod \
            --function-version ${{ steps.dev.outputs.version }} \
            --region sa-east-1

      - name: Confirmar PROD
        run: |
          aws lambda get-alias \
            --function-name bot-whatsapp \
            --name prod \
            --region sa-east-1